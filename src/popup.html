<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>YouTube Auto Speed</title>
        <link rel="stylesheet" href="../dist/popup.css" />
    </head>
    <body>
        <h1>YouTube Auto Speed</h1>
        <p class="description">
            Automatically speeds up YouTube when nobody is speaking.
        </p>
        <div class="row">
            <label for="enabled-toggle">Enable auto speed</label>
            <span class="switch">
                <input type="checkbox" id="enabled-toggle" />
                <span class="slider"></span>
            </span>
        </div>
        <div class="row">
            <label for="ramp-duration">Ramp duration (s)</label>
            <input
                type="number"
                id="ramp-duration"
                min="0.5"
                max="30"
                step="0.5"
            />
        </div>
        <div class="row">
            <label for="talking-speed">Talking speed (x)</label>
            <input type="text" id="talking-speed" inputmode="decimal" />
        </div>
        <div class="row">
            <label for="silent-speed">Silent speed (x)</label>
            <input type="text" id="silent-speed" inputmode="decimal" />
        </div>
        <script src="./popup.ts"></script>
    </body>
</html>
