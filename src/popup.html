<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>YouTube Auto Speed</title>
        <style>
            :root {
                color-scheme: light dark;
            }

            body {
                font-family: system-ui, sans-serif;
                font-size: 14px;
                margin: 0;
                padding: 12px;
                width: 300px;
            }

            h1 {
                font-size: 14px;
                font-weight: 600;
                margin: 0 0 4px;
            }

            .description {
                color: rgba(128, 128, 128, 0.9);
                font-size: 12px;
                margin: 0 0 16px;
            }

            .row {
                align-items: center;
                display: flex;
                justify-content: space-between;
                gap: 12px;
            }

            .row + .row {
                margin-top: 12px;
            }

            input[type="number"],
            input[type="text"] {
                font-size: 14px;
                padding: 4px 6px;
                width: 64px;
            }

            .switch {
                display: inline-block;
                flex-shrink: 0;
                height: 22px;
                position: relative;
                width: 40px;
            }

            .switch input {
                height: 0;
                opacity: 0;
                width: 0;
            }

            .slider {
                background-color: #b0b0b0;
                border-radius: 11px;
                bottom: 0;
                cursor: pointer;
                left: 0;
                position: absolute;
                right: 0;
                top: 0;
                transition: 0.2s;
            }

            .slider::before {
                background-color: white;
                border-radius: 50%;
                bottom: 2px;
                content: "";
                height: 18px;
                left: 2px;
                position: absolute;
                transition: 0.2s;
                width: 18px;
            }

            .switch input:checked + .slider {
                background-color: #2196f3;
            }

            .switch input:checked + .slider::before {
                transform: translateX(18px);
            }
        </style>
    </head>
    <body>
        <h1>YouTube Auto Speed</h1>
        <p class="description">
            Automatically speeds up YouTube when nobody is speaking.
        </p>
        <div class="row">
            <label for="enabled-toggle">Enable auto speed</label>
            <span class="switch">
                <input type="checkbox" id="enabled-toggle" />
                <span class="slider"></span>
            </span>
        </div>
        <div class="row">
            <label for="ramp-duration">Ramp duration (s)</label>
            <input
                type="number"
                id="ramp-duration"
                min="0.5"
                max="30"
                step="0.5"
            />
        </div>
        <div class="row">
            <label for="talking-speed">Talking speed (x)</label>
            <input type="text" id="talking-speed" inputmode="decimal" />
        </div>
        <div class="row">
            <label for="silent-speed">Silent speed (x)</label>
            <input type="text" id="silent-speed" inputmode="decimal" />
        </div>
        <script src="../dist/popup.js"></script>
    </body>
</html>
