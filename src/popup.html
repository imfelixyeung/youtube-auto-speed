<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Dynamic Speed for YouTube</title>
        <link rel="stylesheet" href="../dist/popup.css" />
    </head>
    <body class="w-75 bg-base-100 p-3 text-sm text-base-content">
        <header class="mb-4">
            <h1 class="text-sm font-semibold">Dynamic Speed for YouTube</h1>
            <p class="mt-0.5 text-xs opacity-60">
                Automatically speeds up YouTube when nobody is speaking.
            </p>
        </header>

        <label class="label row" for="enabled-toggle">
            <span>Enable auto speed</span>
            <input type="checkbox" id="enabled-toggle" class="toggle" />
        </label>

        <label class="label row" for="always-show-chart-toggle">
            <span>Always show speed chart</span>
            <input
                type="checkbox"
                id="always-show-chart-toggle"
                class="toggle"
            />
        </label>

        <label class="label row" for="filter-brackets-toggle">
            <span>Filter out [...]</span>
            <input type="checkbox" id="filter-brackets-toggle" class="toggle" />
        </label>

        <label class="label row" for="filter-parens-toggle">
            <span>Filter out (...)</span>
            <input type="checkbox" id="filter-parens-toggle" class="toggle" />
        </label>

        <label class="label row" for="ramp-duration">
            <span>Ramp duration (s)</span>
            <input
                type="number"
                id="ramp-duration"
                class="input input-sm w-16"
                min="0.5"
                max="30"
                step="0.5"
            />
        </label>

        <label class="label row" for="talking-speed">
            <span>Talking speed (x)</span>
            <input
                type="number"
                id="talking-speed"
                class="input input-sm w-16"
                inputmode="decimal"
            />
        </label>

        <label class="label row" for="silent-speed">
            <span>Silent speed (x)</span>
            <input
                type="number"
                id="silent-speed"
                class="input input-sm w-16"
                inputmode="decimal"
            />
        </label>

        <script src="./popup.ts"></script>
    </body>
</html>
